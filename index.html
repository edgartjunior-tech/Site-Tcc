<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Pneumático TCC - PneumaticSys</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const WindIcon = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12.8 19.6A2 2 0 1 0 14 16H2" /><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" /><path d="M9.8 4.4A2 2 0 1 1 11 8H2" />
      </svg>
    );

    const PulseIcon = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
      </svg>
    );

    const PowerIcon = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0" /><line x1="12" y1="2" x2="12" y2="12" />
      </svg>
    );

    const DashboardIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
      </svg>
    );

    const AlertIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
    );

    const CheckCircleIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const LogOutIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    );

    function App() {
      const [currentNav, setCurrentNav] = useState('dashboard');
      const [leakDetected, setLeakDetected] = useState(false);
      const [rooms, setRooms] = useState([
        { id: 1, name: 'Laboratório 1', reservedBy: 'Prof. Silva', active: false },
        { id: 2, name: 'Laboratório 2', reservedBy: 'Prof. Souza', active: false },
        { id: 3, name: 'Oficina Mecânica', reservedBy: null, active: false },
        { id: 4, name: 'Sala de Projetos', reservedBy: null, active: false },
      ]);

      const toggleLeakSimulation = () => {
        setLeakDetected(!leakDetected);
      };

      const activeRoomsCount = rooms.filter(r => r.active).length;

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#f1f5f9]">
          
          <aside className="w-64 bg-[#0a0f1d] text-white flex flex-col justify-between flex-shrink-0">
            <div>
              <div className="p-6 flex items-center gap-3 border-b border-slate-800/60">
                <div className="text-blue-400">
                  <WindIcon />
                </div>
                <h1 className="font-bold text-xl tracking-tight">PneumaticSys</h1>
              </div>

              <div className="p-4 space-y-6">
                <div>
                  <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 px-3">
                    Navegação
                  </p>
                  <nav className="space-y-1">
                    <button
                      onClick={() => setCurrentNav('dashboard')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                        currentNav === 'dashboard' 
                          ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' 
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                      }`}
                    >
                      <DashboardIcon />
                      Dashboard Geral
                    </button>

                    <button
                      onClick={() => setCurrentNav('salas')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                        currentNav === 'salas' 
                          ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' 
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                      }`}
                    >
                      <PowerIcon />
                      Controle de Salas
                    </button>

                    <button
                      onClick={() => setCurrentNav('alertas')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                        currentNav === 'alertas' 
                          ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' 
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                      }`}
                    >
                      <AlertIcon />
                      Alertas
                    </button>
                  </nav>
                </div>

                <div className="p-3.5 bg-slate-900/80 border border-slate-800 rounded-xl space-y-3">
                  <p className="text-xs text-slate-400 font-medium">Simulação de Testes (TCC)</p>
                  <button
                    onClick={toggleLeakSimulation}
                    className={`w-full py-2 px-3 rounded-lg text-xs font-bold transition-all border ${
                      leakDetected 
                        ? 'bg-red-600 text-white border-red-500 hover:bg-red-700 animate-pulse' 
                        : 'bg-red-950/40 text-red-300 border-red-900/60 hover:bg-red-900/50'
                    }`}
                  >
                    {leakDetected ? 'Cancelar Vazamento' : 'Simular Vazamento de Ar'}
                  </button>
                </div>
              </div>
            </div>

            <div className="p-4 border-t border-slate-800/80 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm text-white">
                  P
                </div>
                <div>
                  <p className="text-sm font-bold text-slate-100 leading-tight">Prof. Souza</p>
                  <p className="text-xs text-slate-400">Professor</p>
                </div>
              </div>
              <button className="text-slate-400 hover:text-red-400 p-1.5 transition-colors flex items-center gap-1 text-xs font-semibold">
                <LogOutIcon />
                <span>Sair</span>
              </button>
            </div>
          </aside>

          <main className="flex-1 overflow-y-auto p-8 space-y-8">
            
            <div className="flex justify-between items-center">
              <h2 className="text-2xl font-black text-slate-800 tracking-tight">Dashboard</h2>
              
              <div className={`flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold border transition-colors ${
                leakDetected 
                  ? 'bg-red-50 text-red-700 border-red-200' 
                  : 'bg-emerald-50 text-emerald-700 border-emerald-200'
              }`}>
                {leakDetected ? <AlertIcon /> : <CheckCircleIcon />}
                <span>{leakDetected ? 'ALERTA DE VAZAMENTO ATIVO' : 'Linha de Ar Normal'}</span>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-5">
                <div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0">
                  <PulseIcon />
                </div>
                <div>
                  <p className="text-xs font-semibold text-slate-500 mb-0.5">Pressão Linha Principal</p>
                  <p className="text-2xl font-black text-slate-800">
                    {leakDetected ? '3.2' : '8.5'} <span className="text-sm font-bold text-slate-400">BAR</span>
                  </p>
                </div>
              </div>

              <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-5">
                <div className="w-12 h-12 rounded-2xl bg-cyan-50 text-cyan-600 flex items-center justify-center flex-shrink-0">
                  <WindIcon />
                </div>
                <div>
                  <p className="text-xs font-semibold text-slate-500 mb-0.5">Fluxo Estimado</p>
                  <p className="text-2xl font-black text-slate-800">
                    {leakDetected ? '340' : '120'} <span className="text-sm font-bold text-slate-400">L/min</span>
                  </p>
                </div>
              </div>

              <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-5">
                <div className="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center flex-shrink-0">
                  <PowerIcon />
                </div>
                <div>
                  <p className="text-xs font-semibold text-slate-500 mb-0.5">Salas em Uso</p>
                  <p className="text-2xl font-black text-slate-800">
                    {activeRoomsCount} <span className="text-sm font-bold text-slate-400">/ 4</span>
                  </p>
                </div>
              </div>

            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
              <div className="flex items-center gap-2 text-slate-800 font-bold text-base">
                <div className="text-blue-600">
                  <WindIcon />
                </div>
                <h3>Monitoramento Geral dos Laboratórios</h3>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {rooms.map((room) => (
                  <div key={room.id} className="p-4 bg-slate-50/70 border border-slate-200/70 rounded-xl space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="font-bold text-slate-800 text-sm">{room.name}</h4>
                      <span className={`w-2.5 h-2.5 rounded-full ${room.active ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}`}></span>
                    </div>

                    <div>
                      <p className="text-xs text-slate-500 font-medium">
                        {room.reservedBy ? `Reservada: ${room.reservedBy}` : 'Livre para uso'}
                      </p>
                      <p className={`text-xs font-semibold mt-1 ${room.active ? 'text-emerald-600' : 'text-slate-400'}`}>
                        {room.active ? 'Ar Ativado' : 'Ar Desativado'}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
