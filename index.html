<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Controle de Ar Comprimido</title>
  
  <!-- Tailwind CSS para estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para interpretar a sintaxe JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [usernameInput, setUsernameInput] = useState('prof.souza');
      const [currentUser, setCurrentUser] = useState(null);
      const [currentView, setCurrentView] = useState('dashboard');
      
      const [globalStatus, setGlobalStatus] = useState({ 
        mainPressure: 8.5, 
        leakDetected: false, 
        leakLocation: null, 
        totalFlow: 120 
      });

      const [benches, setBenches] = useState([
        { id: 1, name: 'Bancada 01', active: false, isContinuous: false, pressure: 0, targetTime: 0, timeLeft: 0, history: Array(20).fill(0) },
        { id: 2, name: 'Bancada 02', active: false, isContinuous: false, pressure: 0, targetTime: 0, timeLeft: 0, history: Array(20).fill(0) },
        { id: 3, name: 'Bancada 03', active: false, isContinuous: false, pressure: 0, targetTime: 0, timeLeft: 0, history: Array(20).fill(0) },
        { id: 4, name: 'Bancada 04', active: false, isContinuous: false, pressure: 0, targetTime: 0, timeLeft: 0, history: Array(20).fill(0) },
      ]);

      const handleLogin = (e) => {
        e.preventDefault();
        setIsLoggedIn(true);
        setCurrentUser({ name: usernameInput, role: 'Professor' });
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setCurrentUser(null);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
              <div className="text-center">
                <h1 className="text-2xl font-black text-slate-800">Controle Pneumático</h1>
                <p className="text-slate-500 text-sm mt-1">Acesso ao Laboratório TCC</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Usuário</label>
                  <input 
                    type="text" 
                    value={usernameInput}
                    onChange={(e) => setUsernameInput(e.target.value)}
                    className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none font-medium"
                    required 
                  />
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
                  Entrar no Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Barra Superior */}
          <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
              <h1 className="font-bold text-lg">Painel de Controle Pneumático</h1>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-sm text-slate-300">Usuário: <strong>{currentUser?.name}</strong></span>
              <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                Sair
              </button>
            </div>
          </header>

          {/* Conteúdo Principal */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p className="text-xs font-bold text-slate-400 uppercase">Pressão Geral</p>
                <p className="text-3xl font-black text-slate-800 mt-1">{globalStatus.mainPressure} BAR</p>
              </div>
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p className="text-xs font-bold text-slate-400 uppercase">Vazão Total</p>
                <p className="text-3xl font-black text-slate-800 mt-1">{globalStatus.totalFlow} L/min</p>
              </div>
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p className="text-xs font-bold text-slate-400 uppercase">Status de Segurança</p>
                <p className={`text-xl font-bold mt-2 ${globalStatus.leakDetected ? 'text-red-600' : 'text-emerald-600'}`}>
                  {globalStatus.leakDetected ? 'Alerta de Vazamento' : 'Sistema Normal'}
                </p>
              </div>
            </div>

            {/* Grid das Bancadas */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {benches.map(bench => (
                <div key={bench.id} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                  <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h3 className="font-bold text-slate-800">{bench.name}</h3>
                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${bench.active ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                      {bench.active ? 'Ativa' : 'Desligada'}
                    </span>
                  </div>
                  <div className="p-6">
                    <p className="text-sm text-slate-500">Pressão Local: <strong className="text-slate-800">{bench.pressure} BAR</strong></p>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
